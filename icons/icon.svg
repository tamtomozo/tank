<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#14203d"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6f52"/>
      <stop offset="1" stop-color="#4a3b2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g fill="#e2e8f0">
    <circle cx="120" cy="110" r="3"/><circle cx="380" cy="90" r="2.5"/><circle cx="420" cy="170" r="2"/>
    <circle cx="90" cy="200" r="2"/><circle cx="250" cy="70" r="2"/><circle cx="330" cy="140" r="1.6"/>
    <circle cx="170" cy="160" r="1.6"/>
  </g>
  <!-- planet horizon -->
  <circle cx="256" cy="1010" r="680" fill="url(#ground)"/>
  <circle cx="256" cy="1010" r="680" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.85"/>
  <!-- tank, top-down, heading up-right -->
  <g transform="translate(256 300) rotate(-30)">
    <ellipse cx="0" cy="14" rx="96" ry="80" fill="#000" opacity="0.35"/>
    <!-- tracks -->
    <rect x="-82" y="-92" width="38" height="184" rx="12" fill="#181b20" stroke="#374151" stroke-width="4"/>
    <rect x="44" y="-92" width="38" height="184" rx="12" fill="#181b20" stroke="#374151" stroke-width="4"/>
    <g stroke="#4b5563" stroke-width="4">
      <line x1="-80" y1="-60" x2="-46" y2="-60"/><line x1="-80" y1="-28" x2="-46" y2="-28"/>
      <line x1="-80" y1="4" x2="-46" y2="4"/><line x1="-80" y1="36" x2="-46" y2="36"/><line x1="-80" y1="68" x2="-46" y2="68"/>
      <line x1="46" y1="-60" x2="80" y2="-60"/><line x1="46" y1="-28" x2="80" y2="-28"/>
      <line x1="46" y1="4" x2="80" y2="4"/><line x1="46" y1="36" x2="80" y2="36"/><line x1="46" y1="68" x2="80" y2="68"/>
    </g>
    <!-- hull -->
    <rect x="-54" y="-84" width="108" height="168" rx="14" fill="#4d6b45" stroke="#32472c" stroke-width="5"/>
    <rect x="-40" y="62" width="80" height="10" rx="3" fill="#f59e0b"/>
    <!-- barrel -->
    <rect x="-9" y="-176" width="18" height="140" rx="4" fill="#3f5a38" stroke="#32472c" stroke-width="4"/>
    <rect x="-13" y="-182" width="26" height="22" rx="4" fill="#32472c"/>
    <!-- turret -->
    <circle cx="0" cy="0" r="46" fill="#5c7f52" stroke="#32472c" stroke-width="5"/>
    <circle cx="14" cy="12" r="12" fill="#32472c"/>
  </g>
</svg>
